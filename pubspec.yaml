name: bnpb
description: A Flutter project for managing contacts and visualizing data.
publish_to: none
version: 1.2.0
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  graphview: ^1.2.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  share_plus: ^12.0.2
  file_picker: ^11.0.3
  sqlite3: ^3.1.7
  sqflite_sqlcipher: ^3.4.1
  sqflite_common_ffi: ^2.4.2+1
  sqlcipher_flutter_libs: ^0.7.0+eol
  path: ^1.8.3
  google_fonts: ^8.2.1
  timeline_tile: ^2.0.0
  fl_chart: ^1.2.0
  http: ^1.2.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  flutter_secure_storage: ^10.3.1
  local_auth: ^3.0.2
  csv: ^8.0.0
  pdf: ^3.12.0
  archive: ^4.0.9
  encrypt: ^5.0.1
  shared_preferences: ^2.5.5
  uuid: ^4.6.0
  crypto: ^3.0.7
  meta: ^1.17.0
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  flutter_gemma: ^0.12.6
  google_generative_ai: ^0.4.7
  disk_space_plus: ^0.2.3
  flutter_downloader: ^1.12.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  path_provider_platform_interface: 2.1.3
  plugin_platform_interface: any
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: '#ffffff'
  adaptive_icon_foreground: assets/images/app_icon.png
  macos:
    generate: true
    image_path: assets/images/app_icon.png
  windows:
    generate: true
    image_path: assets/images/app_icon.png
  web:
    generate: true
    image_path: assets/images/app_icon.png

name: Flutter CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: 'stable'
          # You can specify a version if needed, e.g., flutter-version: '3.19.0'
          # checks pubspec.yaml for sdk version

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      # Release build catches R8/proguard regressions from native deps
      # (e.g. flutter_gemma's MediaPipe libs) that `flutter test` doesn't.
      - run: flutter build apk --release --target-platform=android-arm64
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.vfs.watch=false"
